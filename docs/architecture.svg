<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1220"/><stop offset="1" stop-color="#070d16"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="720" fill="url(#bg)" rx="14"/>
  <text x="40" y="46" fill="#e6f1ff" font-size="21" font-weight="700">清漪（QingyiPersonal）运行时架构</text>
  <text x="40" y="70" fill="#7d93ad" font-size="12">QQ 上的个人 AI 伴侣 · 记忆 / 情感 / 目标 / 运维四大内核 · 派生自 agent-qq-sandbox-bot</text>

  <!-- 外部 -->
  <rect x="40" y="110" width="150" height="58" rx="8" fill="#12203a" stroke="#3d5a80"/>
  <text x="115" y="135" fill="#cfe6f7" font-size="13" text-anchor="middle" font-weight="600">QQ 客户端</text>
  <text x="115" y="154" fill="#7d93ad" font-size="10" text-anchor="middle">群聊 / 私聊 / 图片 / 语音</text>

  <rect x="40" y="210" width="150" height="72" rx="8" fill="#12203a" stroke="#3d5a80"/>
  <text x="115" y="236" fill="#cfe6f7" font-size="13" text-anchor="middle" font-weight="600">NapCat (Docker)</text>
  <text x="115" y="255" fill="#7d93ad" font-size="10" text-anchor="middle">OneBot v11 · WS :3001</text>
  <text x="115" y="271" fill="#e2b16b" font-size="9" text-anchor="middle">版本与设备指纹锁定</text>

  <line x1="115" y1="168" x2="115" y2="210" stroke="#5b7a99" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 主进程 -->
  <rect x="250" y="110" width="470" height="480" rx="12" fill="#0d1830" stroke="#3d5a80" stroke-width="1.4"/>
  <text x="485" y="138" fill="#e6f1ff" font-size="14" text-anchor="middle" font-weight="700">launcher.py（qqbot.service 单进程）</text>
  <line x1="190" y1="246" x2="250" y2="246" stroke="#5b7a99" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="272" y="158" width="210" height="120" rx="8" fill="#13233f" stroke="#4a6fa5"/>
  <text x="377" y="180" fill="#9fd3ff" font-size="12" text-anchor="middle" font-weight="600">对话主链路 bridge</text>
  <text x="377" y="200" fill="#7d93ad" font-size="10" text-anchor="middle">入站缓存 → 会话裁决</text>
  <text x="377" y="216" fill="#7d93ad" font-size="10" text-anchor="middle">提示词装配（分层记忆）</text>
  <text x="377" y="232" fill="#7d93ad" font-size="10" text-anchor="middle">发送前自我纠正 → 回执</text>
  <text x="377" y="250" fill="#7d93ad" font-size="10" text-anchor="middle">首气泡 ≤ 2.5s 预算降级</text>

  <rect x="502" y="158" width="200" height="120" rx="8" fill="#13233f" stroke="#4a6fa5"/>
  <text x="602" y="180" fill="#9fd3ff" font-size="12" text-anchor="middle" font-weight="600">Web 面板（Flask）</text>
  <text x="602" y="200" fill="#7d93ad" font-size="10" text-anchor="middle">人格 / 记忆 / 模型 / 监控</text>
  <text x="602" y="216" fill="#7d93ad" font-size="10" text-anchor="middle">人格板块 12 tab</text>
  <text x="602" y="232" fill="#7d93ad" font-size="10" text-anchor="middle">CSRF + 管理员/观察员</text>
  <text x="602" y="250" fill="#7d93ad" font-size="10" text-anchor="middle">nginx 443 · 域名直连</text>

  <!-- 四大内核 -->
  <rect x="272" y="300" width="210" height="86" rx="8" fill="#152a24" stroke="#4d8f6f"/>
  <text x="377" y="322" fill="#a8e6c9" font-size="12" text-anchor="middle" font-weight="600">记忆内核</text>
  <text x="377" y="342" fill="#7d93ad" font-size="10" text-anchor="middle">认知账本 · 分库治理 · 世界书</text>
  <text x="377" y="358" fill="#7d93ad" font-size="10" text-anchor="middle">Ripple 关联检索 R01–R06</text>
  <text x="377" y="374" fill="#7d93ad" font-size="10" text-anchor="middle">单一写入者 self_model</text>

  <rect x="502" y="300" width="200" height="86" rx="8" fill="#2a1a2e" stroke="#9a5fa8"/>
  <text x="602" y="322" fill="#e2b8ef" font-size="12" text-anchor="middle" font-weight="600">情感内核</text>
  <text x="602" y="342" fill="#7d93ad" font-size="10" text-anchor="middle">情绪影子（只观测）</text>
  <text x="602" y="358" fill="#7d93ad" font-size="10" text-anchor="middle">效价候选（未接入）</text>
  <text x="602" y="374" fill="#7d93ad" font-size="10" text-anchor="middle">表达门 C06 灰度</text>

  <rect x="272" y="406" width="210" height="86" rx="8" fill="#2a2415" stroke="#b08a3e"/>
  <text x="377" y="428" fill="#f0d488" font-size="12" text-anchor="middle" font-weight="600">目标与行动</text>
  <text x="377" y="448" fill="#7d93ad" font-size="10" text-anchor="middle">goal_attention · 行动提案</text>
  <text x="377" y="464" fill="#7d93ad" font-size="10" text-anchor="middle">外发仲裁 outward_release</text>
  <text x="377" y="480" fill="#7d93ad" font-size="10" text-anchor="middle">好奇驱动 · B站自主刷片</text>

  <rect x="502" y="406" width="200" height="86" rx="8" fill="#1c2536" stroke="#5b7a99"/>
  <text x="602" y="428" fill="#cfe6f7" font-size="12" text-anchor="middle" font-weight="600">运维自动驾驶</text>
  <text x="602" y="448" fill="#7d93ad" font-size="10" text-anchor="middle">巡检 autopilot · 计划投影</text>
  <text x="602" y="464" fill="#7d93ad" font-size="10" text-anchor="middle">批准账本（云端权威）</text>
  <text x="602" y="480" fill="#7d93ad" font-size="10" text-anchor="middle">报文只走 ops outbox</text>

  <!-- 检测层 -->
  <rect x="272" y="512" width="430" height="56" rx="8" fill="#182031" stroke="#4a6fa5" stroke-dasharray="4 3"/>
  <text x="487" y="534" fill="#9fd3ff" font-size="12" text-anchor="middle" font-weight="600">检测与审计层</text>
  <text x="487" y="552" fill="#7d93ad" font-size="10" text-anchor="middle">72 任务目录 · 在线契约 58 · 独立回放 62 · 只读沙箱探针 · 能力五态</text>

  <!-- 模型路由 -->
  <rect x="780" y="158" width="260" height="220" rx="10" fill="#101c30" stroke="#3d5a80"/>
  <text x="910" y="182" fill="#e6f1ff" font-size="13" text-anchor="middle" font-weight="600">模型路由 llm_router</text>
  <text x="910" y="204" fill="#7d93ad" font-size="10" text-anchor="middle">七组通道 · 自适应降级 · 预算分流</text>
  <rect x="800" y="220" width="220" height="30" rx="5" fill="#13233f"/>
  <text x="910" y="239" fill="#9fd3ff" font-size="10" text-anchor="middle">文本/视觉 · 百炼 qwen</text>
  <rect x="800" y="256" width="220" height="30" rx="5" fill="#13233f"/>
  <text x="910" y="275" fill="#9fd3ff" font-size="10" text-anchor="middle">长文 gpt-6.1-sol → sonnet → 文本</text>
  <rect x="800" y="292" width="220" height="30" rx="5" fill="#13233f"/>
  <text x="910" y="311" fill="#9fd3ff" font-size="10" text-anchor="middle">图像 flare → qwen-image</text>
  <rect x="800" y="328" width="220" height="30" rx="5" fill="#13233f"/>
  <text x="910" y="347" fill="#9fd3ff" font-size="10" text-anchor="middle">语音 TTS×3 · 摘要/兜底 DeepSeek</text>
  <line x1="722" y1="218" x2="780" y2="218" stroke="#5b7a99" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 数据 -->
  <rect x="780" y="406" width="260" height="184" rx="10" fill="#101c30" stroke="#3d5a80"/>
  <text x="910" y="430" fill="#e6f1ff" font-size="13" text-anchor="middle" font-weight="600">数据资产（仅本机）</text>
  <text x="910" y="454" fill="#7d93ad" font-size="10" text-anchor="middle">认知账本 cognition.db · SQLite</text>
  <text x="910" y="474" fill="#7d93ad" font-size="10" text-anchor="middle">群事实库 / 会话记忆 / 好感度</text>
  <text x="910" y="494" fill="#7d93ad" font-size="10" text-anchor="middle">运维账本 ops/state.json</text>
  <text x="910" y="514" fill="#7d93ad" font-size="10" text-anchor="middle">世界书版本化 · 记忆清单 manifests</text>
  <text x="910" y="534" fill="#7d93ad" font-size="10" text-anchor="middle">token 用量 / 账单对账</text>
  <text x="910" y="560" fill="#e2b16b" font-size="9" text-anchor="middle">全部数据不入库 · 备份先行</text>
  <line x1="722" y1="498" x2="780" y2="498" stroke="#5b7a99" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 底部说明 -->
  <text x="40" y="630" fill="#7d93ad" font-size="11">边界：NapCat 永不自动重启 · 授权一律以云端批准账本为准 · 表达接管仅在人工签字与全部门锁通过后注入 · 运维报文与角色记忆隔离</text>
  <text x="40" y="656" fill="#5b7392" font-size="11">上游：CeylanCLC/agent-qq-sandbox-bot（OneBot QQ 机器人平台基座）· 本项目重写其人格内核与运维体系</text>
  <text x="40" y="686" fill="#42586f" font-size="10">图中不含任何真实主机、账号或密钥；部署所需环境变量见 README。</text>
</svg>
