ht="30" rx="4" class="edge-bg"/><text x="608.5" y="1604.875484503403" class="edge" text-anchor="middle">拒绝或已认领</text></g><g data-diagram-edge-id="g14"><path d="M 166 1713 H 154 V 1880 H 198.2509690068058" fill="none" stroke="#3677bb" stroke-width="1.5" marker-end="url(#arrow-module)"/><rect x="108" y="1804.01" width="92" height="30" rx="4" class="edge-bg"/><text x="154" y="1823.01" class="edge" text-anchor="middle">接受≠已读</text></g><g data-diagram-edge-id="g15"><path d="M 490 1713 H 502 V 1880 H 592.2509690068058" fill="none" stroke="#3677bb" stroke-width="1.5" marker-end="url(#arrow-module)"/><rect x="448" y="1804.01" width="108" height="30" rx="4" class="edge-bg"/><text x="502" y="1823.01" class="edge" text-anchor="middle">拒绝或无回包</text></g><g data-diagram-node-id="g-start" class="node-drawing"><title>收到新群消息</title><g class="shape-label"><rect x="208" y="152" width="240" height="72" rx="36" class="node-surface" fill="#eff0f1" stroke="#6a7c75" stroke-width="1.2"/><text x="328" y="195.5" class="shape-title" text-anchor="middle">收到新群消息</text></g></g><g data-diagram-node-id="g-accept" class="node-drawing"><title>消息与队列可准入？</title><g class="shape-label"><polygon points="328,304 461.5,371 328,438 194.5,371" class="node-surface" fill="#eff0f1" stroke="#6a7c75" stroke-width="1.2"/><text x="328" y="364" class="shape-title" text-anchor="middle">消息与队列可</text><text x="328" y="393" class="shape-title" text-anchor="middle">准入？</text></g></g><g data-diagram-node-id="g-opportunity" class="node-drawing"><title>防抖冷却与机会通过？</title><g class="shape-label"><polygon points="328,518 473,585 328,652 183,585" class="node-surface" fill="#eaf0f7" stroke="#3677bb" stroke-width="1.2"/><text x="328" y="578" class="shape-title" text-anchor="middle">防抖冷却与机</text><text x="328" y="607" class="shape-title" text-anchor="middle">会通过？</text></g></g><g data-diagram-node-id="g-lock" class="node-drawing"><title>群turn锁与发言闸可用？</title><g class="shape-label"><polygon points="328,732 488,799 328,866 168,799" class="node-surface" fill="#eaf0f7" stroke="#3677bb" stroke-width="1.2"/><text x="328" y="792" class="shape-title" text-anchor="middle">群turn锁与发言</text><text x="328" y="821" class="shape-title" text-anchor="middle">闸可用？</text></g></g><g data-diagram-node-id="g-owner" class="node-drawing"><title>归属与joinable允许？</title><g class="shape-label"><polygon points="328,946 479.5,1042 328,1138 176.5,1042" class="node-surface" fill="#eaf0f7" stroke="#3677bb" stroke-width="1.2"/><text x="328" y="1020.5" class="shape-title" text-anchor="middle">归属与</text><text x="328" y="1049.5" class="shape-title" text-anchor="middle">joinable允</text><text x="328" y="1078.5" class="shape-title" text-anchor="middle">许？</text></g></g><g data-diagram-node-id="g-fresh" class="node-drawing"><title>候选未过时且非沉默？</title><g class="shape-label"><polygon points="328,1218 473,1285 328,1352 183,1285" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="328" y="1278" class="shape-title" text-anchor="middle">候选未过时且</text><text x="328" y="1307" class="shape-title" text-anchor="middle">非沉默？</text></g></g><g data-diagram-node-id="g-send" class="node-drawing"><title>清理、同意与outbox认领通过？</title><g class="shape-label"><polygon points="328,1432 524.5,1499 328,1566 131.5,1499" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="328" y="1492" class="shape-title" text-anchor="middle">清理、同意与outbox</text><text x="328" y="1521" class="shape-title" text-anchor="middle">认领通过？</text></g></g><g data-diagram-node-id="g-result" class="node-drawing"><title>OneBot明确accepted？</title><g class="shape-label"><polygon points="328,1646 490,1713 328,1780 166,1713" class="node-surface" fill="#eaf0f7" stroke="#3677bb" stroke-width="1.2"/><text x="328" y="1706" class="shape-title" text-anchor="middle">OneBot明确</text><text x="328" y="1735" class="shape-title" text-anchor="middle">accepted？</text></g></g><g data-diagram-node-id="g-done" class="node-drawing"><title>记录接受与发言冷却</title><g class="shape-label"><rect x="194.5" y="1860" width="267" height="72" rx="36" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="328" y="1903.5" class="shape-title" text-anchor="middle">记录接受与发言冷却</text></g></g><g data-diagram-node-id="g-stop" class="node-drawing"><title>本次不发 / 保留未证实</title><g class="shape-label"><rect x="588.5" y="1677" width="307" height="72" rx="36" class="node-surface" fill="#eaf0f7" stroke="#3677bb" stroke-width="1.2"/><text x="742" y="1720.5" class="shape-title" text-anchor="middle">本次不发 / 保留未证实</text></g></g><g data-diagram-node-id="g-unknown" class="node-drawing"><title>记failed或unknown，不称送达</title><g class="shape-label"><rect x="588.5" y="1860" width="401" height="72" rx="36" class="node-surface" fill="#eaf0f7" stroke="#3677bb" stroke-width="1.2"/><text x="789" y="1903.5" class="shape-title" text-anchor="middle">记failed或unknown，不称送达</text></g></g><g data-notes="3"><text x="64" y="2008" class="group">要点</text><text x="64" y="2039" class="body">•</text><text x="84" y="2039" class="body">FORCE=8为源码默认，线上覆盖为5；只在joinable允许时兜底，不能抢别人的双人对话。</text><text x="64" y="2069" class="body">•</text><text x="84" y="2069" class="body">概率门不是命令；模型仍能沉默，生成期间新消息会使候选过时。</text><text x="64" y="2099" class="body">•</text><text x="84" y="2099" class="body">本轮逐函数AST比较频率逻辑不变；线上settings部署前后逐字节一致。</text></g></svg>
